apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-university-api
  namespace: university-platform
spec:
  template:
    spec:
      containers:
        - name: api
          imagePullPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-university-nginx
  namespace: university-platform
spec:
  template:
    spec:
      containers:
        - name: nginx
          imagePullPolicy: Always
