_format_version: "3.0"
_transform: true

services:
  - name: oracle-university-platform
    url: http://127.0.0.1:30080
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: university-api
        paths:
          - /
        strip_path: false
        preserve_host: false
        protocols:
          - http

plugins:
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

  - name: rate-limiting
    config:
      minute: 120
      policy: local
      limit_by: ip
      hide_client_headers: false

  - name: request-size-limiting
    config:
      allowed_payload_size: 2
      size_unit: megabytes

  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      upstream_health_metrics: true

  - name: response-transformer
    config:
      add:
        headers:
          - "X-Content-Type-Options:nosniff"
          - "X-Frame-Options:DENY"
