stages:
  - test
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

api-tests:
  stage: test
  image: python:3.12-slim
  cache:
    key:
      files:
        - api/requirements-dev.txt
    paths:
      - .cache/pip
  before_script:
    - python -m pip install
        --disable-pip-version-check
        --retries 10
        --resume-retries 10
        --timeout 60
        --requirement api/requirements-dev.txt
  script:
    - python -m compileall -q api/main.py api/test_main.py
    - cd api
    - pytest -q
        --junitxml=test-results.xml
        --cov=main
        --cov-report=term-missing
        --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: api/test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: api/coverage.xml
    paths:
      - api/coverage.xml

.container-build:
  stage: build
  image: docker:cli
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" |
        docker login "$CI_REGISTRY"
        --username "$CI_REGISTRY_USER"
        --password-stdin
  script:
    - export COMMIT_IMAGE="$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHA"
    - docker build
        --pull
        --file "$CONTAINERFILE"
        --tag "$COMMIT_IMAGE"
        "$BUILD_CONTEXT"
    - docker push "$COMMIT_IMAGE"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        LATEST_IMAGE="$CI_REGISTRY_IMAGE/$IMAGE_NAME:latest"
        docker tag "$COMMIT_IMAGE" "$LATEST_IMAGE"
        docker push "$LATEST_IMAGE"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH

build-api-image:
  extends: .container-build
  needs:
    - api-tests
  variables:
    IMAGE_NAME: api
    CONTAINERFILE: api/Containerfile
    BUILD_CONTEXT: api

build-nginx-image:
  extends: .container-build
  needs:
    - api-tests
  variables:
    IMAGE_NAME: nginx
    CONTAINERFILE: platform/nginx/Containerfile
    BUILD_CONTEXT: platform/nginx
